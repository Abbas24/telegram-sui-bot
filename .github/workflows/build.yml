name: Build and Release Bot
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Build
        run: go build -v -o bot ./cmd/bot/main.go
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bot
          path: bot
